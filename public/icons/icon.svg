<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8"/>
  
  <!-- Mast -->
  <line x1="250" y1="90" x2="250" y2="350" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Main Sail -->
  <path d="M 240 100 L 240 330 L 110 330 Z" fill="url(#sailGrad)" opacity="0.95"/>
  
  <!-- Jib / Foresail -->
  <path d="M 260 120 L 390 330 L 260 330 Z" fill="#0ea5e9" opacity="0.85"/>
  
  <!-- Sailboat Hull -->
  <path d="M 80 350 L 432 350 L 380 400 L 140 400 Z" fill="url(#hullGrad)"/>
  
  <!-- Water waves -->
  <path d="M 50 420 Q 120 400 190 420 T 330 420 T 470 420" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M 80 445 Q 150 425 220 445 T 360 445 T 500 445" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  
  <!-- IoT Signal Waves -->
  <path d="M 250 65 A 25 25 0 0 1 275 90" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 250 45 A 45 45 0 0 1 295 90" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <circle cx="250" cy="90" r="6" fill="#38bdf8"/>
</svg>
